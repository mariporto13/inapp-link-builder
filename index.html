<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InApp Link Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <h1>InApp Link Builder v0.1.1</h1>
      <p>Generate AppsFlyer tracking URLs based on client specifications.</p>
    </header>

    <main class="grid-layout">
      <!-- Input Form -->
      <section class="card form-section">
        <h2>Configuration Parameters</h2>
        <form id="linkForm">
          <div class="form-group">
            <label for="mmpSelect">Mobile Measurement Partner (MMP):</label>
            <select id="mmpSelect">
              <option value="appsflyer">AppsFlyer</option>
              <option value="adjust">Adjust</option>
            </select>
          </div>

          <div class="form-group">
            <label for="linkTypeSelect">Link Type:</label>
            <select id="linkTypeSelect">
              <!-- Populated dynamically via JS based on selected MMP -->
            </select>
          </div>

          <!-- Attribution Window Inputs -->
          <div class="form-row">
            <div class="form-group">
              <label for="clWindow">Click lookback window (install -> app open)</label>
              <input type="text" id="clWindow" placeholder="7d">
            </div>
            <div class="form-group">
              <label for="reWindow">Reengagement window (app open -> conversion)</label>
              <input type="text" id="reWindow" placeholder="7d">
            </div>
          </div>

          <!-- App ID Inputs -->
          <div class="form-row">
            <div class="form-group">
              <label for="androidId">Android App ID</label>
              <input type="text" id="androidId" placeholder="com.globo.globotv">
            </div>
            <div class="form-group">
              <label for="iosId">iOS App ID</label>
              <input type="text" id="iosId" placeholder="id536321738">
            </div>
          </div>

          <!-- Campaign Parameter Inputs -->
          <div class="form-row">
            <div class="form-group">
              <label for="androidC">Android Campaign</label>
              <input type="text" id="androidC" placeholder="Default: rtbhouse-retargeting">
            </div>
            <div class="form-group">
              <label for="iosC">iOS Campaign</label>
              <input type="text" id="iosC" placeholder="Default: rtbhouse-retargeting">
            </div>
          </div>

          <!-- Deep Link Inputs -->
          <div class="form-row field-group" id="deeplinkGroup">
            <div class="form-group">
              <label for="androidDp">Android Deep Link (include macros and UTMs*)</label>
              <textarea id="androidDp" rows="3"
                placeholder="greatapp://path/to/product/id/{OFFER_IDENTIFIER}?utm_source=rtbhouse&utm_medium=retargeting&utm_campaign=rtbhouse-campaign-android"></textarea>
            </div>
            <div class="form-group">
              <label for="iosDp">iOS Deep Link (include macros and UTMs*)</label>
              <textarea id="iosDp" rows="3"
                placeholder="greatapp://path/to/product/id/{OFFER_IDENTIFIER}?utm_source=rtbhouse&utm_medium=retargeting&utm_campaign=rtbhouse-campaign-ios"></textarea>
            </div>
          </div>

          <!-- Redirect Inputs -->
          <div class="form-row field-group" id="redirectGroup">
            <div class="form-group">
              <label for="androidRedirect">Android Link (include macros and UTMs*)</label>
              <textarea id="androidRedirect" rows="3"
                placeholder="{OFFER_URL}?utm_source=rtbhouse&utm_medium=retargeting&utm_campaign=rtbhouse-campaign-android"></textarea>
            </div>
            <div class="form-group">
              <label for="iosRedirect">iOS Link (include macros and UTMs*)</label>
              <textarea id="iosRedirect" rows="3"
                placeholder="{OFFER_URL}?utm_source=rtbhouse&utm_medium=retargeting&utm_campaign=rtbhouse-campaign-ios"></textarea>
            </div>
          </div>

          <!-- OneLink Input -->
          <div class="form-group field-group" id="onelinkGroup">
            <label for="onelinkDomain">OneLink URL</label>
            <input type="text" id="onelinkDomain" placeholder="https://example.onelink.me/0000">
          </div>


          <div><label>*UTMs are required if the MMP is not used for Client stats</label></div>

          <div class="button-group">
            <button type="button" id="generateBtn" class="btn btn-primary">Generate Links</button>
          </div>
        </form>
      </section>

      <!-- Results Section -->
      <section class="card form-section">
        <div class="results-section">
          <h2>Results</h2>
          <div id="resultsContainer">
            <!-- Populated dynamically via JS -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>

</html>
