<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InApp Link Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <h1>InApp Link Builder v0.1.1</h1>
      <p>Generate AppsFlyer tracking URLs based on client specifications.</p>
    </header>

    <main class="grid-layout">
      <!-- Input Form -->
      <section class="card form-section">
        <h2>Configuration Parameters</h2>
        <form id="linkForm">
          <div class="form-group">
            <label for="mmpSelect">Mobile Measurement Partner (MMP):</label>
            <select id="mmpSelect">
              <option value="appsflyer">AppsFlyer</option>
            </select>
          </div>

          <div class="form-group">
            <label for="linkTypeSelect">Link Type:</label>
            <select id="linkTypeSelect">
              <!-- Populated dynamically via JS based on selected MMP -->
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="clWindow">Click lookback window (install -> app open)</label>
              <input type="text" id="clWindow" placeholder="e.g. 7d">
            </div>
            <div class="form-group">
              <label for="reWindow">Reengagement window (app open -> conversion)</label>
              <input type="text" id="reWindow" placeholder="e.g. 7d">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="androidId">Android App ID</label>
              <input type="text" id="androidId" placeholder="e.g. com.globo.globotv">
            </div>
            <div class="form-group">
              <label for="iosId">iOS App ID</label>
              <input type="text" id="iosId" placeholder="e.g. id536321738">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="androidC">Android Campaign</label>
              <input type="text" id="androidC" placeholder="Default: rtbhouse-retargeting">
            </div>
            <div class="form-group">
              <label for="iosC">iOS Campaign</label>
              <input type="text" id="iosC" placeholder="Default: rtbhouse-retargeting">
            </div>
          </div>

          <!-- Dynamic Deep Link Inputs -->
          <div class="form-row field-group" id="deeplinkGroup">
            <div class="form-group">
              <label for="androidDp">Android Deep Link</label>
              <input type="text" id="androidDp" placeholder="e.g. greatapp://path">
            </div>
            <div class="form-group">
              <label for="iosDp">iOS Deep Link</label>
              <input type="text" id="iosDp" placeholder="e.g. greatapp://path">
            </div>
          </div>

          <!-- Dynamic Redirect Inputs -->
          <div class="form-row field-group" id="redirectGroup">
            <div class="form-group">
              <label for="androidRedirect">Android Redirect URL</label>
              <input type="text" id="androidRedirect" placeholder="Optional redirect URL">
            </div>
            <div class="form-group">
              <label for="iosRedirect">iOS Redirect URL</label>
              <input type="text" id="iosRedirect" placeholder="Optional redirect URL">
            </div>
          </div>

          <!-- OneLink Domain Input -->
          <div class="form-group field-group" id="onelinkGroup">
            <label for="onelinkDomain">OneLink Base Domain URL</label>
            <input type="text" id="onelinkDomain" placeholder="https://example.onelink.me/0000">
          </div>

          <div class="button-group">
            <button type="button" id="generateBtn" class="btn btn-primary">Generate Links</button>
            <button type="button" id="copyBtn" class="btn btn-secondary">Copy Results</button>
          </div>
        </form>
      </section>

      <!-- Results Section -->
      <div class="results-section">
        <h2>Generated Results</h2>
        <div id="resultsContainer">
          <!-- Dynamic copyable output blocks will render here -->
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>

</html>
