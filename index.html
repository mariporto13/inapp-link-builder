<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InApp Link Builder</title>
  <link rel="icon" type="image/x-icon" href="assets/Frame-1.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <h1>InApp Link Builder v0.2</h1>
      <p>Generate tracking URLs based on client specifications.</p>
    </header>

    <main class="grid-layout">
      <!-- Input Form -->
      <section class="card form-section">
        <h2>Configuration Parameters</h2>
        <form id="linkForm">
          <div class="form-group">
            <label for="mmpSelect">Mobile Measurement Partner (MMP):</label>
            <select id="mmpSelect">
              <option value="appsflyer">AppsFlyer</option>
              <option value="adjust">Adjust (WIP)</option>
              <option value="singular">Singular (WIP)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="linkTypeSelect">Link Type:</label>
            <select id="linkTypeSelect">
              <!-- Populated dynamically via JS -->
            </select>
          </div>

          <!-- Platform Selection -->
          <div class="form-group">
            <label>Platform:</label>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="platformSelect" value="both" checked> Android & iOS
              </label>
              <label class="radio-label">
                <input type="radio" name="platformSelect" value="android"> Android only
              </label>
              <label class="radio-label">
                <input type="radio" name="platformSelect" value="ios"> iOS only
              </label>
            </div>
          </div>

          <!-- Attribution Window Inputs (AppsFlyer) -->
          <div class="field-group" id="windowGroup">
            <div class="form-row">
              <div class="form-group">
                <label for="clWindow">Click lookback window (install -> app open)</label>
                <select id="clWindow">
                  <!-- Generated via JS -->
                </select>
              </div>
              <div class="form-group">
                <label for="reWindow">Reengagement window (app open -> conversion)</label>
                <select id="reWindow">
                  <!-- Generated via JS -->
                </select>
              </div>
            </div>
          </div>

          <!-- App ID Inputs (AppsFlyer) -->
          <div class="field-group" id="appIdGroup">
            <div class="form-row">
              <div class="form-group" id="androidIdField">
                <label for="androidId">Android App ID</label>
                <input type="text" id="androidId" placeholder="com.example">
              </div>
              <div class="form-group" id="iosIdField">
                <label for="iosId">iOS App ID</label>
                <input type="text" id="iosId" placeholder="id123456789">
              </div>
            </div>
          </div>

          <!-- Tracker ID Inputs (Adjust) -->
          <div class="field-group" id="trackerGroup">
            <div class="form-row">
              <div class="form-group" id="androidTrackerField">
                <label for="androidTracker">Android Tracker ID</label>
                <input type="text" id="androidTracker" placeholder="abc1234">
              </div>
              <div class="form-group" id="iosTrackerField">
                <label for="iosTracker">iOS Tracker ID</label>
                <input type="text" id="iosTracker" placeholder="abc1234">
              </div>
            </div>
          </div>

          <!-- Base Link Inputs (Singular) -->
          <div class="field-group" id="baseLinkGroup">
            <div class="form-row">
              <div class="form-group" id="androidBaseLinkField">
                <label for="androidBaseLink">Android Base Link</label>
                <input type="text" id="androidBaseLink" placeholder="https://[DOMAIN].sng.link/[PARAM1]/[PARAM2]">
              </div>
              <div class="form-group" id="iosBaseLinkField">
                <label for="iosBaseLink">iOS Base Link</label>
                <input type="text" id="iosBaseLink" placeholder="https://[DOMAIN].sng.link/[PARAM1]/[PARAM2]">
              </div>
            </div>
          </div>

          <!-- Campaign Parameter Inputs -->
          <div class="form-row">
            <div class="form-group" id="androidCField">
              <label for="androidC">Android Campaign</label>
              <input type="text" id="androidC" placeholder="Default: rtbhouse-retargeting">
            </div>
            <div class="form-group" id="iosCField">
              <label for="iosC">iOS Campaign</label>
              <input type="text" id="iosC" placeholder="Default: rtbhouse-retargeting">
            </div>
          </div>

          <!-- Deeplink Inputs -->
          <div class="field-group" id="deeplinkGroup">
            <div class="form-row">
              <div class="form-group" id="androidDpField">
                <label for="androidDp">Android Deeplink (include macros and UTMs)</label>
                <textarea id="androidDp" rows="3"
                  placeholder="greatapp://path/to/product/id/{OFFER_IDENTIFIER}"></textarea>
              </div>
              <div class="form-group" id="iosDpField">
                <label for="iosDp">iOS Deeplink (include macros and UTMs)</label>
                <textarea id="iosDp" rows="3" placeholder="greatapp://path/to/product/id/{OFFER_IDENTIFIER}"></textarea>
              </div>
            </div>
            <label class="note-label">Note: UTMs are required if the MMP is not used for Client stats.</label>
          </div>

          <!-- Redirect Inputs -->
          <div class="field-group" id="redirectGroup">
            <div class="form-row">
              <div class="form-group" id="androidRedirectField">
                <label for="androidRedirect">Android Link (include macros and UTMs)</label>
                <textarea id="androidRedirect" rows="3"
                  placeholder="{OFFER_URL}?utm_source=rtbhouse&utm_medium=retargeting&utm_campaign=rtbhouse-campaign-android"></textarea>
              </div>
              <div class="form-group" id="iosRedirectField">
                <label for="iosRedirect">iOS Link (include macros and UTMs)</label>
                <textarea id="iosRedirect" rows="3"
                  placeholder="{OFFER_URL}?utm_source=rtbhouse&utm_medium=retargeting&utm_campaign=rtbhouse-campaign-ios"></textarea>
              </div>
            </div>
            <label class="note-label">Note: UTMs are required if the MMP is not used for Client stats.</label>
          </div>

          <!-- OneLink Input (AppsFlyer) -->
          <div class="field-group" id="onelinkGroup">
            <div class="form-row">
              <div class="form-group" id="androidOnelinkField">
                <label for="androidOnelink">Android OneLink (include macros and UTMs)</label>
                <textarea id="androidOnelink" rows="3" placeholder="https://greatapp.onelink.me/328f"></textarea>
              </div>
              <div class="form-group" id="iosOnelinkField">
                <label for="iosOnelink">iOS OneLink (include macros and UTMs)</label>
                <textarea id="iosOnelink" rows="3" placeholder="https://greatapp.onelink.me/328f"></textarea>
              </div>
            </div>
            <label class="note-label">Note 1: make sure the link is not "https://greatapp.onelink.me/328f/12345", the
              "12345" part might cause issues with attribution.</label>
            <label class="note-label">Note 2: UTMs are required if the MMP is not used for Client stats.</label>
          </div>

          <!-- Custom Parameters Input -->
          <div class="form-group">
            <label for="customParams">Custom Parameters</label>
            <input type="text" id="customParams" placeholder="&param1=value1&param2=value2">
          </div>

          <!-- Impression Tracking Option -->
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="impressionCheck">
              Generate Impression tracking URLs (if this option is not selected, only Click URLs will be generated).
            </label>
          </div>

          <!-- Impression Attribution Window Inputs (AppsFlyer) -->
          <div class="field-group" id="impressionGroup">
            <div class="form-row">
              <div class="form-group">
                <label for="vtWindow">Viewthrough lookback window (install -> app open)</label>
                <select id="vtWindow">
                  <!-- Generated via JS -->
                </select>
              </div>
              <div class="form-group">
                <label for="impReWindow">Imp reengagement window (app open -> conversion)</label>
                <select id="impReWindow">
                  <!-- Generated via JS -->
                </select>
              </div>
            </div>
          </div>

          <div class="button-group">
            <button type="button" id="generateBtn" class="btn btn-primary">Generate Links</button>
          </div>
        </form>
      </section>

      <!-- Results Section -->
      <section class="card form-section">
        <div class="results-section">
          <h2>Results</h2>
          <div id="resultsContainer">
            <!-- Populated dynamically via JS -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>

</html>
